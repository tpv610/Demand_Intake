flow:
  initial_question_id: requested_change
  domain_field: domain
  phases:
  - id: opening
    max_questions: 3
  - id: domain_discovery
    max_questions: 2
    resolve_when:
      field: answers.domain
      operator: answered
    attempt_counter: domain_clarification_attempts
    completion_flag: domain_discovery_complete
  - id: application_context
  - id: discovery
  max_answer_attempts: 2
  blocking_statuses:
  - missing
  - unconfirmed
invalidation:
- field: integration_required
  clear:
  - integration_systems
  - integration_flow
  - integration_details
- field: application_context
  clear:
  - existing_application
- field: target_timeline
  clear:
  - timeline_commitment
  - timing_reason
model:
  name: gpt-5.4
  environment_override: OPENAI_MODEL
  timeout_seconds: 90
  max_retries: 0
  reasoning_effort: low
ui:
  title: Demand Intake
  caption: Describe your requirement. The interview asks only for missing information.
  new: New Demand
  chat_placeholder: Describe your demand, answer the question, or correct earlier
    information
  choice_label: Select an answer
  choice_placeholder: Choose an option
  submit: Submit answer
  other_hint: Type your answer below. It will be interpreted in context.
  select_hint: Select an option or use the text input below.
  error: Unable to process this action. Your captured information is retained. Check
    your connection and configuration, then try again.
  summary_title: Review captured information
  none: Not supplied
  unconfirmed: Not confirmed
  not_applicable: Not applicable
  ready: The defined interview is complete. Review the captured information.
  blocked: 'Required information is still unresolved: {fields}. You can provide it
    in the chat.'
  confirm: Confirm summary
  confirmed: Summary confirmed. You can still correct information in the chat.
  generate: Generate Demand
  generate_spinner: Preparing demand and mock Jira issue...
  jira_created: 'Mock Jira issue created: {key}'
  download_md: Download demand (.md)
  download_json: Download demand (.json)
  json_title: Structured demand
  followup: '{label}: {status}'
  api_key_missing: Set OPENAI_API_KEY in your .env file before submitting free text.
  parse_missing: The model returned no structured response. Please retry.
  stale_selection: This selection is no longer the active question.
  not_ready: Complete and confirm the interview before generating a demand.
  invalid_choice: Select one of the configured choices.
  title_invalid: Generated title exceeds configured limits. Your captured information
